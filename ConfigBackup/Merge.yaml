# Clash Verge Rev Merge 模板（全局通用，不依赖特定代理组，对所有订阅安全生效）
prepend-rules:
  - DOMAIN,localhost,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  # ScienceDirect PDF 与 Elsevier 辅助 CDN 规则（默认 DIRECT）
  # __ACADEMIC_RULES__
  # __BLOCK_QUIC_RULE__

profile:
  store-selected: true
  store-fake-ip: true

ipv6: false

# __TUN_BLOCK__

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - localhost
    - "*.local"
    - localhost.ptlogin2.qq.com
    - mirrors.pku.edu.cn
    - mirrors.tuna.tsinghua.edu.cn
    - mirrors.aliyun.com
    - mirrors.ustc.edu.cn
